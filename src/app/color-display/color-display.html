<h2>Visualización</h2>

<div class="contenedor">

  <div>
    <p>Color original</p>

    <div
      class="cuadro"
      [style.background-color]="color">
    </div>

    <p>{{ color }}</p>
  </div>

  <div>
    <p>Escala de grises</p>

    <div
      class="cuadro"
      [style.background-color]="colorGris">

    <p>{{ gris }}, {{ gris }}, {{ gris }}</p>
  </div>

</div>
